services:
  tupa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:${PUBLISH_PORT:-8000}:${TUPA_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      # TZ is used when TUPA_TZ=system; output otherwise defaults to ART.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
