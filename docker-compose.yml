services:
  tupa:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "tupa", "--serve"]
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:${PUBLISH_PORT:-8000}:${TUPA_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      RES_OPTIONS: "${RES_OPTIONS:-timeout:1 attempts:1}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
